[project]
name = "research-tool"
version = "0.1.0"
description = "Streamlit app and MCP server for searching, scoring, and indexing academic papers, with RAG-based Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.4.1",
    "langchain>=1.2.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17",
    "langchain-ollama>=1.0.1",
    "langchain-text-splitters>=1.1.1",
    "loguru>=0.7.3",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.5",
    "mcp[cli]>=1.0.0",
    "requests>=2.32.5",
    "streamlit>=1.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The working directory and sys.path must be set before the project imports.
"mcp_server.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
